<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>Nice Boys – Hors ligne</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        padding: 2rem 1rem;
        text-align: center;
        background: #0a0a0a;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .logo {
        width: 160px;
        height: 160px;
        object-fit: contain;
        border-radius: 50%;
        border: 3px solid #161616;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      }
      .title {
        font-size: clamp(2.8rem, 12vw, 4.5rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 0.9;
        background: linear-gradient(135deg, #fff 0%, #d1d5db 50%, #9ca3af 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        font-size: 1.4rem;
        color: #9f7aea;
        font-variant-caps: all-small-caps;
        font-weight: 500;
      }
      .message { color: #a0a0a0; max-width: 28rem; line-height: 1.4; }
      button {
        margin-top: 0.5rem;
        padding: 0.8rem 1.8rem;
        border: 1px solid #c084fc;
        border-radius: 999px;
        background: transparent;
        color: #c084fc;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover, button:focus-visible { background: #c084fc; color: #0a0a0a; }
      button:disabled { opacity: 0.6; cursor: progress; }
      .status { min-height: 1.4em; color: #c084fc; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <img class="logo" src="/logo.webp" alt="Logo Nice Boys" width="400" height="347" />
    <h1 class="title">NICE BOYS</h1>
    <p class="subtitle">Tribute Guns N' Roses</p>
    <p class="message">Pas de connexion pour le moment… on attend le retour du réseau pour remonter sur scène 🤘</p>
    <button type="button" id="retry">Actualiser</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <script>
      const retryButton = document.getElementById("retry");
      const statusEl = document.getElementById("status");

      retryButton.addEventListener("click", () => {
        // Toujours sans réseau : on le dit, au lieu de recharger la même page sans rien montrer
        if (!navigator.onLine) {
          statusEl.textContent = "Toujours pas de réseau… vérifie ta connexion et réessaie.";
          return;
        }
        retryButton.disabled = true;
        retryButton.textContent = "Connexion…";
        statusEl.textContent = "";
        location.reload();
      });

      // Recharge automatiquement dès que la connexion revient
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
